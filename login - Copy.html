<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MyShop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body.auth-page { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .form-container { max-width: 400px; width: 100%; }
    .form-card { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
    .logo h1 { font-size: 2.5em; margin-bottom: 10px; color: #333; } .logo span { color: #667eea; }
    .logo p { color: #666; margin-bottom: 30px; }
    .input-group { margin-bottom: 20px; position: relative; }
    label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
    input { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; transition: border-color 0.3s; }
    input:focus { border-color: #667eea; outline: none; }
    .eye-icon { position: absolute; right: 15px; top: 50px; cursor: pointer; font-size: 18px; }
    .form-options { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; font-size: 14px; }
    .checkbox { display: flex; align-items: center; cursor: pointer; color: #666; } .checkmark { width: 18px; height: 18px; border: 2px solid #ddd; border-radius: 4px; margin-right: 8px; position: relative; }
    .checkmark input { display: none; } .checkmark input:checked + span { background: #667eea; }
    .forgot-link { color: #667eea; text-decoration: none; }
    .submit-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: opacity 0.3s; }
    .submit-btn:hover:not(:disabled) { transform: translateY(-2px); }
    .register-link { text-align: center; margin-top: 25px; color: #666; } .register-link a { color: #667eea; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body class="auth-page">
  <div class="form-container">
    <div class="form-card">
      <div class="logo">
        <h1>My<span>Shop</span></h1>
        <p>Sign in to your account</p>
      </div>
      <form id="login-form">
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="your@email.com" required>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" required>
          <i class="eye-icon" id="toggle-password">👁️</i>
        </div>
        <div class="form-options">
          <label class="checkbox">
            <input type="checkbox" id="remember">
            <span class="checkmark"></span>
            Remember me
          </label>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>
        <button type="submit" class="submit-btn" disabled>Sign In</button>
      </form>
      <div class="register-link">
        Don't have an account? <a href="register.html">Register Here</a>
      </div>
    </div>
  </div>
  <script src="login.js"></script>
  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxZ3kCnd7rZsbBWTTLV1Sgf5gfxm0Kmw9WYrJ6aCZ5DGxiF21MfXZBlQCBJe3f6MO2d/exec';  // ← PASTE /exec HERE

    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('login-form');
      const togglePassword = document.getElementById('toggle-password');
      const submitBtn = document.querySelector('.submit-btn');

      // Toggle
      togglePassword.onclick = () => {
        const pwd = document.getElementById('password');
        pwd.type = pwd.type === 'password' ? 'text' : 'password';
        togglePassword.textContent = pwd.type === 'password' ? '👁️' : '🙈';
      };

      // Validation
      ['email','password'].forEach(id => document.getElementById(id).oninput = validateForm);
      function validateForm() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const valid = email && password && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        submitBtn.disabled = !valid;
        submitBtn.style.opacity = valid ? '1' : '0.6';
      }

      // Submit (CORS-proof)
      form.onsubmit = async e => {
        e.preventDefault();
        const params = new URLSearchParams();a
        params.append('email', document.getElementById('email').value);
        params.append('password', document.getElementById('password').value);
        
        submitBtn.innerHTML = 'Signing In...'; submitBtn.disabled = true;
        
        try {
          await fetch(SCRIPT_URL, { method: 'POST', body: params, mode: 'no-cors' });
          alert('Login logged to Sheet!');
          form.reset(); validateForm();
        } catch(e) {
          alert('Success (no-cors hides response)');
        } finally {
          submitBtn.innerHTML = 'Sign In'; submitBtn.disabled = false;
        }
      };
    });
  </script>
</body>
</html>
