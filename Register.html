<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - MyShop</title>
  <link rel="stylesheet" href="Register.css">
</head>
<body class="auth-page">
  <div class="form-container">
    <div class="form-card">
      <div class="logo">
        <h1>My<span>Shop</span></h1>
        <p>Create your account</p>
      </div>
      <form id="register-form" class="register-form">
        <div class="input-row">
          <div class="input-group">
            <label>First Name</label>
            <input type="text" id="first-name" name="first-name" required>
          </div>
          <div class="input-group">
            <label>Last Name</label>
            <input type="text" id="last-name" name="last-name" required>
          </div>
        </div>
        <div class="input-group">
          <label>Gender</label>
          <select id="gender" name="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="input-group">
          <label>Mobile Number</label>
          <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" placeholder="10 digit number" required>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" name="password" minlength="6" required>
          <i class="eye-icon" id="toggle-password">👁️</i>
        </div>
        <div class="input-group">
          <label>Confirm Password</label>
          <input type="password" id="confirm-password" id="confirm-password" required>
          <i class="eye-icon" id="toggle-confirm">👁️</i>
        </div>
    
        <button type="submit" class="submit-btn">Create Account</button>
      </form>
      <div class="login-link">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>
  <script src="register.js"></script>
</body>
</html>
